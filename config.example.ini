; Example Chequer configuration. Copy this to config.ini (or point --config or
; CHEQUER_CONFIG at it) and adjust to taste. Every key is optional; the values
; shown here are the defaults unless noted otherwise.

[server]
; Address and port to listen on, as host:port. Use 0.0.0.0:3000 to listen on
; all interfaces.
listen = 127.0.0.1:3000

; Public URL of the app, used for OIDC redirects and the CSRF origin check.
; Defaults to http://<listen host>:<listen port>; set it whenever the app is
; reached through a proxy or a different host name.
;base-url = https://chequer.example.com

; Time zone used to display instants when the browser doesn't report one.
time-zone = UTC

[database]
; Path to the SQLite database file, created if it doesn't exist. Migration
; backups are written alongside it.
path = chequer.db

[auth]
; One of single, proxy or oidc.
mode = single

[auth.single]
; The owner user everyone acts as in single mode.
name = owner
title = Owner

[auth.proxy]
; Header carrying the authenticated username (required in proxy mode).
;header = X-Forwarded-User

; Comma-separated IPs or CIDRs allowed to set the header.
trusted-proxies = 127.0.0.1, ::1

[auth.oidc]
; Issuer URL, used for discovery (required in oidc mode).
;issuer = https://sso.example.com/realms/home

; Client credentials (required in oidc mode). The redirect URI to register with
; the provider is <base-url>/auth/callback.
;client-id = chequer
;client-secret = change-me

; Hex key of at least 32 bytes that signs the login cookie (required in oidc
; mode). Generate one with: openssl rand -hex 32
;cookie-key =

; Requested scopes.
scopes = openid profile email

; Session lifetime, as a number of days (d), hours (h) or minutes (m).
session-ttl = 14d
